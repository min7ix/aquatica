name: Build Aquatica for Apple Silicon macOS

on:
  push:
    branches:
      - main
      - macos-support
    tags:
      - "macos-test-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # macos-15 is a native Apple Silicon (arm64) GitHub-hosted runner.
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Download and verify bundled MPV
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mpv-arm64-0.40.0.tar.gz"
          curl --fail --location --retry 3 \
            "https://laboratory.stolendata.net/~djinn/mpv_osx/mpv-arm64-0.40.0.tar.gz" \
            --output "$archive"
          echo "3170fb709defebaba33e9755297d70dc3562220541de54fc3d494a8309ef1260  $archive" | shasum -a 256 --check
          tar -tzf "$archive" | grep -Fx "mpv.app/Contents/MacOS/mpv"
          mkdir -p src-tauri/binaries
          tar -xzf "$archive" --strip-components=3 -C src-tauri/binaries mpv.app/Contents/MacOS/mpv
          chmod 755 src-tauri/binaries/mpv
          file src-tauri/binaries/mpv
          otool -L src-tauri/binaries/mpv
          src-tauri/binaries/mpv --version

      - name: Build Apple Silicon DMG
        run: npm run tauri -- build --config src-tauri/tauri.macos.conf.json --target aarch64-apple-darwin --bundles dmg
        env:
          # Produce an unsigned test build. Distribution still requires signing
          # and notarization with an Apple Developer identity.
          APPLE_SIGNING_IDENTITY: "-"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: aquatica-macos-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged test release
        if: startsWith(github.ref, 'refs/tags/macos-test-')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
