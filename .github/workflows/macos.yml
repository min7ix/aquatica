name: Build Aquatica for Apple Silicon macOS

on:
  push:
    branches:
      - main
      - macos-support
    tags:
      - "macos-test-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # macos-15 is a native Apple Silicon (arm64) GitHub-hosted runner.
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Apple Silicon DMG
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles dmg
        env:
          # Produce an unsigned test build. Distribution still requires signing
          # and notarization with an Apple Developer identity.
          APPLE_SIGNING_IDENTITY: "-"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: aquatica-macos-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged test release
        if: startsWith(github.ref, 'refs/tags/macos-test-')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
